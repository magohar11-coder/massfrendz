<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MassFrendz</title>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
nav{height:60px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 15px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.container{max-width:500px;margin:auto;padding:10px}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
button{background:#00c853;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-weight:bold}
.friend{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.friend img{width:35px;height:35px;border-radius:50%}
.chat{position:fixed;bottom:0;right:10px;width:300px;height:380px;background:#fff;border-radius:10px 10px 0 0;display:flex;flex-direction:column;box-shadow:0 5px 25px rgba(0,0,0,.3)}
.chat-body{flex:1;overflow:auto;background:#eee;padding:8px}
.msg-me{align-self:flex-end;background:#0084ff;color:#fff;padding:6px 10px;border-radius:12px;margin:3px}
.msg-them{align-self:flex-start;background:#fff;padding:6px 10px;border-radius:12px;margin:3px}
</style>
</head>

<body>

<div id="login" style="height:100vh;display:flex;align-items:center;justify-content:center">
<button onclick="login()">Login with Google</button>
</div>

<div id="app" style="display:none">
<nav>
<b>MassFrendz</b>
<div>
<span id="myName"></span>
<button onclick="logout()" style="background:red">Logout</button>
</div>
</nav>

<div class="container">

<div class="card">
<textarea id="postTxt" placeholder="What's on your mind?" style="width:100%"></textarea>
<button onclick="addPost()">Post</button>
</div>

<div class="card">
<b>Friends</b>
<div id="friends"></div>
</div>

<div id="posts"></div>

</div>
</div>

<div id="chatBox"></div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
authDomain:"massfrendz.firebaseapp.com",
databaseURL:"https://massfrendz-default-rtdb.firebaseio.com/",
projectId:"massfrendz"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();
let me=null;

auth.onAuthStateChanged(u=>{
if(!u){login.style.display="flex";app.style.display="none";return;}
me=u;
login.style.display="none";
app.style.display="block";
myName.innerText=u.displayName;

db.ref("users/"+u.uid).update({
name:u.displayName,
pic:u.photoURL,
online:true
});

loadPosts();
loadFriends();
});

function login(){
auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}
function logout(){
db.ref("users/"+me.uid).update({online:false});
auth.signOut();
}

function addPost(){
let t=postTxt.value.trim();
if(!t)return;
db.ref("posts").push({uid:me.uid,text:t,time:Date.now()});
postTxt.value="";
}

function loadPosts(){
db.ref("posts").limitToLast(10).on("child_added",s=>{
const p=s.val();
db.ref("users/"+p.uid).once("value",u=>{
posts.innerHTML=
`<div class="card">
<b>${u.val().name}</b>
<p>${p.text}</p>
<button onclick="openChat('${p.uid}','${u.val().name}')">Message</button>
</div>`+posts.innerHTML;
});
});
}

function loadFriends(){
db.ref("users").on("value",snap=>{
friends.innerHTML="";
snap.forEach(s=>{
if(s.key===me.uid) return;
friends.innerHTML+=
`<div class="friend">
<img src="${s.val().pic}">
${s.val().name}
<button onclick="openChat('${s.key}','${s.val().name}')">Chat</button>
</div>`;
});
});
}

function chatId(uid){
return me.uid < uid ? me.uid+"_"+uid : uid+"_"+me.uid;
}

function openChat(uid,name){
if(uid===me.uid) return;
let cid=chatId(uid);
if(document.getElementById("chat_"+cid)) return;

chatBox.innerHTML+=
`<div class="chat" id="chat_${cid}">
<div style="padding:8px;background:#0084ff;color:#fff">${name}
<span style="float:right;cursor:pointer" onclick="this.parentElement.parentElement.remove()">✖</span>
</div>
<div class="chat-body" id="body_${cid}"></div>
<div style="padding:5px">
<input id="inp_${cid}" style="width:70%">
<button onclick="sendMsg('${cid}')">Send</button>
</div>
</div>`;

db.ref("msgs/"+cid).on("child_added",s=>{
const m=s.val();
document.getElementById("body_"+cid).innerHTML+=
`<div class="${m.s===me.uid?'msg-me':'msg-them'}">${m.t}</div>`;
});
}

function sendMsg(cid){
let inp=document.getElementById("inp_"+cid);
let v=inp.value.trim();
if(!v)return;
db.ref("msgs/"+cid).push({s:me.uid,t:v,time:Date.now()});
inp.value="";
}
</script>

</body>
</html>
