<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassFrendz | Gohar Pro Max</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{--main:#00c853;--fb:#0084ff;--gray:#f0f2f5}
body{
margin:0;
font-family:Segoe UI,Arial;
background:url("https://images.unsplash.com/photo-1529333166437-7750a6dd5a70") center/cover fixed;
min-height:100vh;
}

nav{
position:fixed;top:0;width:100%;height:60px;
background:rgba(255,255,255,.95);
display:flex;align-items:center;justify-content:space-between;
padding:0 15px;box-shadow:0 2px 10px rgba(0,0,0,.1);z-index:1000
}

.container{margin-top:80px;max-width:500px;margin-inline:auto;padding:10px}

.card{
background:#fff;border-radius:12px;padding:15px;
margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.1)
}

.btn{border:none;padding:8px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-main{background:var(--main);color:#fff;width:100%}
.btn-gray{background:#e4e6e9}

.user{
display:flex;align-items:center;gap:10px
}
.user img{width:38px;height:38px;border-radius:50%;object-fit:cover}

.chat-window{
position:fixed;bottom:0;right:15px;width:320px;height:420px;
background:#fff;border-radius:12px 12px 0 0;
display:flex;flex-direction:column;box-shadow:0 5px 25px rgba(0,0,0,.2)
}

.chat-header{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.chat-body{flex:1;background:var(--gray);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

.msg-me{align-self:flex-end;background:var(--fb);color:#fff;padding:8px 12px;border-radius:15px}
.msg-them{align-self:flex-start;background:#fff;padding:8px 12px;border-radius:15px}

.typing{font-size:11px;color:green;font-style:italic}

.friend-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.friend-item img{width:35px;height:35px;border-radius:50%}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="height:100vh;display:flex;align-items:center;justify-content:center">
<button class="btn btn-main" onclick="login()">Login with Google</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<nav>
<b style="color:var(--main)">MassFrendz</b>
<div class="user">
<img id="myPic">
<span id="myName"></span>
<i class="fas fa-sign-out-alt" style="color:red;cursor:pointer" onclick="logout()"></i>
</div>
</nav>

<div class="container">

<div class="card">
<textarea id="postTxt" placeholder="What's on your mind?" style="width:100%;border:none;outline:none"></textarea>
<button class="btn btn-main" onclick="addPost()">Post</button>
</div>

<div class="card">
<b>Friends</b>
<div id="friends"></div>
</div>

<div id="posts"></div>

</div>
</div>

<!-- CHAT -->
<div id="chat"></div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
authDomain:"massfrendz.firebaseapp.com",
databaseURL:"https://massfrendz-default-rtdb.firebaseio.com/",
projectId:"massfrendz"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth(),db=firebase.database();
const tone=new Audio("https://raw.githubusercontent.com/Anand906/Messenger-Tone/main/messenger_tone.mp3");
let me=null;

auth.onAuthStateChanged(u=>{
if(u){
me=u;
login.style.display="none";
app.style.display="block";
db.ref("users/"+u.uid).update({n:u.displayName,p:u.photoURL,online:true});
db.ref("users/"+u.uid).onDisconnect().update({online:false});
myName.innerText=u.displayName;
myPic.src=u.photoURL;
loadPosts();loadFriends();
}else{
login.style.display="flex";
app.style.display="none";
}
});

function login(){
auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

function logout(){
db.ref("users/"+me.uid).update({online:false});
auth.signOut();
}

function addPost(){
let t=postTxt.value.trim();if(!t)return;
db.ref("posts").push({uid:me.uid,t});
postTxt.value="";
}

function loadPosts(){
db.ref("posts").limitToLast(10).on("child_added",s=>{
db.ref("users/"+s.val().uid).once("value",u=>{
posts.innerHTML=
`<div class="card">
<div class="user"><img src="${u.val().p}"><b>${u.val().n}</b></div>
<p>${s.val().t}</p>
<button class="btn btn-gray" onclick="openChat('${s.val().uid}','${u.val().n}','${u.val().p}')">Message</button>
</div>`+posts.innerHTML;
});
});
}

function loadFriends(){
db.ref("friends/"+me.uid).on("value",snap=>{
friends.innerHTML="";
snap.forEach(s=>{
db.ref("users/"+s.key).once("value",u=>{
friends.innerHTML+=
`<div class="friend-item">
<img src="${u.val().p}">
${u.val().n}
<button class="btn btn-gray" onclick="openChat('${s.key}','${u.val().n}','${u.val().p}')">Chat</button>
<button class="btn" onclick="block('${s.key}')">Block</button>
</div>`;
});
});
});
}

function block(uid){
db.ref("blocks/"+me.uid+"/"+uid).set(true);
alert("Blocked");
}

function openChat(uid,name,pic){
db.ref("blocks/"+uid+"/"+me.uid).once("value",b=>{
if(b.exists()){alert("You are blocked");return;}
let id="c_"+uid;
if(document.getElementById(id))return;
chat.innerHTML=
`<div class="chat-window" id="${id}">
<div class="chat-header">
<b>${name}</b>
<span onclick="this.parentElement.parentElement.remove()" style="cursor:pointer">✖</span>
</div>
<div class="chat-body" id="b_${uid}"></div>
<div style="padding:8px">
<input id="i_${uid}" style="width:80%" oninput="typing('${uid}')">
<button onclick="send('${uid}')">➤</button>
<span class="typing" id="t_${uid}"></span>
</div>
</div>`;
db.ref("msgs/"+uid).on("child_added",s=>{
if(s.val().s!=me.uid && document.visibilityState==="visible")tone.play();
document.getElementById("b_"+uid).innerHTML+=
`<div class="${s.val().s==me.uid?'msg-me':'msg-them'}">${s.val().t}</div>`;
});
});
}

function send(uid){
let v=document.getElementById("i_"+uid).value;
if(!v)return;
db.ref("msgs/"+uid).push({s:me.uid,t:v});
document.getElementById("i_"+uid).value="";
db.ref("typing/"+uid+"/"+me.uid).set(false);
}

let tt;
function typing(uid){
clearTimeout(tt);
db.ref("typing/"+uid+"/"+me.uid).set(true);
tt=setTimeout(()=>db.ref("typing/"+uid+"/"+me.uid).set(false),1200);
db.ref("typing/"+uid).on("value",s=>{
document.getElementById("t_"+uid).innerText=s.val()?"typing...":"";
});
}
</script>
</body>
</html>
