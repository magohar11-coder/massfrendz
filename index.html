<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz | Secure Social</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --fb-blue: #0084ff; --dark-bg: #18191a; --card-bg: #242526; --hover-bg: #3a3b3c; }
        body { background: var(--dark-bg); color: #e4e6eb; font-family: 'Segoe UI', Tahoma, Helvetica, Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Layout */
        .navbar { background: var(--card-bg); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #3e4042; }
        .app-layout { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 20px; max-width: 1400px; margin: auto; }

        /* Common Styles */
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .btn { background: var(--fb-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #0073e6; }
        input { background: #3a3b3c; border: none; padding: 12px; border-radius: 20px; color: white; width: 100%; box-sizing: border-box; outline: none; }
        
        /* Profile & Posts */
        .post { border-bottom: 1px solid #3e4042; padding: 15px 0; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        /* Login Page */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }

        @media (max-width: 900px) { .app-layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>

    <div id="login-page" class="login-container">
        <h1 style="color: var(--fb-blue); font-size: 3rem;">Massfrendz</h1>
        <p>Connect securely with friends.</p>
        <button class="btn" style="width: auto; padding: 15px 40px;" onclick="googleLogin()">Login with Google</button>
    </div>

    <div id="app-dashboard" style="display:none;">
        <nav class="navbar">
            <h2 style="color: var(--fb-blue); margin: 0;">Massfrendz</h2>
            <div id="current-user-display" style="display:flex; align-items:center; gap:10px;"></div>
        </nav>

        <div class="app-layout">
            <div class="sidebar">
                <div class="card">
                    <h3>Inbox (Encrypted)</h3>
                    <div id="user-list">Searching for friends...</div>
                </div>
            </div>

            <div class="feed">
                <div class="card">
                    <input type="text" id="postInput" placeholder="What's on your mind?">
                    <button class="btn" onclick="sendPost()" style="margin-top:10px;">Post to Feed</button>
                </div>
                <div id="feed-container"></div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <h3>Privacy Status</h3>
                    <p style="color: #2ecc71;">● End-to-End Encrypted</p>
                    <p style="font-size: 0.8rem; color: #b0b3b8;">Your messages are converted into secure code using AES encryption.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config (Aapki Config)
        const firebaseConfig = {
            apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
            authDomain: "massfrendz.firebaseapp.com",
            projectId: "massfrendz",
            databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // 1. Google Login
        window.googleLogin = () => signInWithRedirect(auth, provider);

        // 2. Auth State (Check login)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('app-dashboard').style.display = 'block';
                
                // Show User Info in Header
                document.getElementById('current-user-display').innerHTML = `
                    <span>${user.displayName}</span>
                    <img src="${user.photoURL}" class="profile-pic">
                `;
                
                loadPosts();
            }
        });

        // 3. Encrypted Post Sending
        window.sendPost = () => {
            const msg = document.getElementById('postInput').value;
            if(msg.trim() !== "") {
                // ENCRYPTION: Message ko code mein badalna
                const secretKey = "massfrendz_key_123"; 
                const encryptedMsg = CryptoJS.AES.encrypt(msg, secretKey).toString();

                push(ref(db, 'posts'), {
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName,
                    pic: auth.currentUser.photoURL,
                    message: encryptedMsg, // Yahan ab "hello" ki jagah code jayega database mein
                    timestamp: serverTimestamp()
                });
                document.getElementById('postInput').value = "";
            }
        };

        // 4. Load & Decrypt Posts
        function loadPosts() {
            onValue(ref(db, 'posts'), (snapshot) => {
                const container = document.getElementById('feed-container');
                container.innerHTML = "";
                snapshot.forEach(item => {
                    const data = item.val();
                    
                    // DECRYPTION: Code ko wapas asli message mein badalna
                    const secretKey = "massfrendz_key_123";
                    const bytes  = CryptoJS.AES.decrypt(data.message, secretKey);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);

                    const postHTML = `
                        <div class="card post">
                            <div class="post-header">
                                <img src="${data.pic || 'https://via.placeholder.com/40'}" class="profile-pic">
                                <div>
                                    <div style="font-weight:bold;">${data.name}</div>
                                    <div style="font-size:0.7rem; color:#b0b3b8;">Secure Message</div>
                                </div>
                            </div>
                            <p style="margin:10px 0;">${originalText}</p>
                        </div>
                    `;
                    container.innerHTML = postHTML + container.innerHTML;
                });
            });
        }
    </script>
</body>
</html>
