<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz | Powered by M.A.Gohar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { 
            --neon-blue: #00f3ff; --neon-pink: #ff00ff; --neon-green: #39ff14; 
            --dark-bg: #0a0b10; --card-bg: #161b22; --text: #e6edf3;
        }
        body { background: var(--dark-bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }

        /* Neon Navbar */
        .navbar { 
            background: rgba(22, 27, 34, 0.9); padding: 0 20px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 2px solid var(--neon-blue); position: sticky; top: 0; z-index: 1000; height: 60px;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .m-logo { 
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink)); 
            color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 26px; font-weight: bold; 
            text-shadow: 0 0 10px #fff; box-shadow: 0 0 15px var(--neon-pink);
        }

        .app-layout { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 20px; max-width: 1300px; margin: auto; }
        .card { 
            background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; 
            border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Neon Inputs */
        input[type="text"] { 
            background: #0d1117; border: 1px solid var(--neon-blue); color: white; 
            padding: 10px 15px; border-radius: 20px; outline: none; width: 100%; box-sizing: border-box;
        }
        input[type="text"]:focus { box-shadow: 0 0 10px var(--neon-blue); }

        /* Chat Window Neon */
        #chat-popup { 
            position: fixed; bottom: 0; right: 50px; width: 320px; height: 480px; 
            background: var(--card-bg); display: none; flex-direction: column; 
            border-radius: 15px 15px 0 0; border: 2px solid var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink); z-index: 2000;
        }
        .msg-sent { background: var(--neon-blue); color: #000; align-self: flex-end; font-weight: 500; }
        .msg-rcvd { background: #30363d; color: #fff; align-self: flex-start; }
        .chat-msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; margin: 5px 0; font-size: 14px; }

        /* Footer */
        .footer-tag { text-align: center; padding: 10px; font-size: 12px; color: var(--neon-green); letter-spacing: 1px; }

        .online-dot { width: 12px; height: 12px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); }
        .block-btn { color: var(--neon-pink); cursor: pointer; border: 1px solid var(--neon-pink); padding: 3px 8px; border-radius: 5px; font-size: 11px; }
        .btn-post { background: var(--neon-blue); border: none; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/1110/1110-preview.mp3"></audio>

    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="m-logo">M</div>
            <input type="text" placeholder="Search friends..." style="width:200px;" onkeyup="searchGlobal(this.value)">
        </div>
        <div id="me-info" style="display:flex; align-items:center; gap:10px;"></div>
    </nav>

    <div class="app-layout">
        <div class="sidebar">
            <div class="card">
                <h3 style="color:var(--neon-blue)">Inbox</h3>
                <div id="user-list"></div>
            </div>
        </div>

        <div class="feed">
            <div class="card">
                <input type="text" id="postText" placeholder="What's on your neon mind?">
                <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                    <label style="color:var(--neon-green); cursor:pointer">🖼️ Photo Only <input type="file" id="postFile" accept="image/*" hidden></label>
                    <button onclick="publishPost()" class="btn-post">Post to Feed</button>
                </div>
            </div>
            <div id="feed-container"></div>
            <div class="footer-tag">Powered by M.A.Gohar</div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h3 style="color:var(--neon-pink)">Neon Settings</h3>
                <p style="font-size:12px">Feed: Images Only<br>Chat: Audio/Video/Images Allowed</p>
                <div id="blocked-status" style="color:var(--neon-pink); font-size:11px;"></div>
            </div>
        </div>
    </div>

    <div id="chat-popup">
        <div style="background:var(--neon-pink); color:white; padding:12px; display:flex; justify-content:space-between;">
            <span id="chat-name">Secure Chat</span>
            <span onclick="closeChat()" style="cursor:pointer">✖</span>
        </div>
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;"></div>
        <div style="padding:10px; border-top:1px solid #333;">
            <div style="display:flex; gap:10px; margin-bottom:8px;">
                <label title="Send Media" style="cursor:pointer">📎<input type="file" accept="image/*,audio/*,video/*" hidden onchange="sendChatMedia(this.files[0])"></label>
                <span onclick="addEmoji('🔥')" style="cursor:pointer">🔥</span>
                <span onclick="addEmoji('😂')" style="cursor:pointer">😂</span>
            </div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chatInput" placeholder="Aa">
                <button onclick="sendPrivateMsg()" style="background:none; border:none; font-size:22px; cursor:pointer">🚀</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, serverTimestamp, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { /* Aapka API Key yahan aayega */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentChatUser = null;
        let myBlockedList = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userRef = ref(db, 'users/' + user.uid);
                set(userRef, { name: user.displayName, pic: user.photoURL, online: true });
                onDisconnect(userRef).update({ online: false });
                document.getElementById('me-info').innerHTML = `<img src="${user.photoURL}" style="width:35px; border-radius:50%; border:2px solid var(--neon-blue)">`;
                loadFeed();
                loadUsers();
                loadBlocks();
            } else { signInWithRedirect(auth, new GoogleAuthProvider()); }
        });

        // --- BLOCK SYSTEM FIX ---
        window.toggleBlock = (uid) => {
            const idx = myBlockedList.indexOf(uid);
            if(idx === -1) myBlockedList.push(uid);
            else myBlockedList.splice(idx, 1);
            set(ref(db, 'blocks/' + auth.currentUser.uid), myBlockedList);
        };

        function loadBlocks() {
            onValue(ref(db, 'blocks/' + auth.currentUser.uid), (s) => {
                myBlockedList = s.val() || [];
                document.getElementById('blocked-status').innerText = "Blocked: " + myBlockedList.length;
            });
        }

        // --- CHAT WITH MEDIA & BLOCK CHECK ---
        window.sendPrivateMsg = () => {
            const txt = document.getElementById('chatInput').value;
            if(!txt || !currentChatUser) return;
            
            // Block Check: Agar aapne use block kiya hai ya usne aapko, toh msg nahi jayega
            if(myBlockedList.includes(currentChatUser)) return alert("Unblock to send message!");

            const chatID = [auth.currentUser.uid, currentChatUser].sort().join("_");
            push(ref(db, 'chats/' + chatID), { sender: auth.currentUser.uid, text: txt, time: serverTimestamp() });
            document.getElementById('chatInput').value = "";
        };

        window.sendChatMedia = (file) => {
            if(myBlockedList.includes(currentChatUser)) return alert("User is blocked!");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const type = file.type.split('/')[0]; // image, video, or audio
                const chatID = [auth.currentUser.uid, currentChatUser].sort().join("_");
                push(ref(db, 'chats/' + chatID), { sender: auth.currentUser.uid, media: reader.result, mediaType: type, time: serverTimestamp() });
            };
        };

        window.openChat = (uid, name) => {
            currentChatUser = uid;
            document.getElementById('chat-name').innerText = name;
            document.getElementById('chat-popup').style.display = 'flex';
            const chatID = [auth.currentUser.uid, uid].sort().join("_");
            
            onValue(ref(db, 'chats/' + chatID), (snap) => {
                const msgDiv = document.getElementById('chat-messages');
                msgDiv.innerHTML = "";
                snap.forEach(m => {
                    const d = m.val();
                    const cls = d.sender === auth.currentUser.uid ? 'msg-sent' : 'msg-rcvd';
                    let content = d.text || "";
                    if(d.media) {
                        if(d.mediaType === 'image') content = `<img src="${d.media}" style="width:100%; border-radius:10px;">`;
                        else if(d.mediaType === 'video') content = `<video src="${d.media}" controls style="width:100%;"></video>`;
                        else if(d.mediaType === 'audio') content = `<audio src="${d.media}" controls style="width:100%;"></audio>`;
                    }
                    msgDiv.innerHTML += `<div class="chat-msg ${cls}">${content}</div>`;
                });
                msgDiv.scrollTop = msgDiv.scrollHeight;
                if(snap.exists() && Object.values(snap.val()).pop().sender !== auth.currentUser.uid) {
                    document.getElementById('beepSound').play();
                }
            });
        };

        // --- FEED (ONLY IMAGES) ---
        window.publishPost = () => {
            const text = document.getElementById('postText').value;
            const file = document.getElementById('postFile').files[0];
            if(file && !file.type.startsWith('image/')) return alert("Feed supports images only!");
            
            const save = (img = "") => {
                push(ref(db, 'posts'), { uid: auth.currentUser.uid, name: auth.currentUser.displayName, pic: auth.currentUser.photoURL, text: text, image: img, timestamp: serverTimestamp() });
                document.getElementById('postText').value = "";
            };
            if(file) { const r = new FileReader(); r.readAsDataURL(file); r.onload = () => save(r.result); } else save();
        };

        function loadFeed() {
            onValue(ref(db, 'posts'), (snap) => {
                const cont = document.getElementById('feed-container');
                cont.innerHTML = "";
                snap.forEach(c => {
                    const p = c.val();
                    if(!myBlockedList.includes(p.uid)) {
                        cont.innerHTML = `<div class="card">
                            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                                <img src="${p.pic}" style="width:35px; border-radius:50%; border:1px solid var(--neon-blue)">
                                <b>${p.name}</b>
                            </div>
                            <p>${p.text}</p>
                            ${p.image ? `<img src="${p.image}" style="width:100%; border-radius:10px;">` : ''}
                        </div>` + cont.innerHTML;
                    }
                });
            });
        }

        function loadUsers() {
            onValue(ref(db, 'users'), (snap) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                snap.forEach(u => {
                    if(u.key !== auth.currentUser.uid) {
                        const d = u.val();
                        list.innerHTML += `<div class="user-row" style="display:flex; align-items:center; gap:10px; padding:10px; cursor:pointer;">
                            <img src="${d.pic}" style="width:35px; border-radius:50%;" onclick="openChat('${u.key}', '${d.name}')">
                            <span onclick="openChat('${u.key}', '${d.name}')">${d.name}</span>
                            ${d.online ? '<div class="online-dot"></div>' : ''}
                            <span class="block-btn" onclick="toggleBlock('${u.key}')">Block</span>
                        </div>`;
                    }
                });
            });
        }

        window.closeChat = () => document.getElementById('chat-popup').style.display = 'none';
        window.addEmoji = (e) => document.getElementById('chatInput').value += e;
    </script>
</body>
</html>
