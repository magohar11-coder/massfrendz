<div id="chat-window">
    <div style="background:var(--main); color:white; padding:12px; display:flex; justify-content:space-between; align-items:center; border-radius:10px 10px 0 0;">
        <div style="display:flex; align-items:center; gap:8px;">
            <img id="chat-user-img" style="width:30px; height:30px; border-radius:50%;">
            <b id="chat-user-name">User</b>
        </div>
        <div style="display:flex; gap:15px;">
            <i class="fas fa-phone" style="cursor:pointer;"></i>
            <i class="fas fa-video" style="cursor:pointer;"></i>
            <span onclick="closeChat()" style="cursor:pointer; font-size:20px;">&times;</span>
        </div>
    </div>
    <div id="chat-msgs" style="flex:1; overflow-y:auto; padding:15px; background:#f9f9f9; display:flex; flex-direction:column; gap:10px;"></div>
    <div id="typing-indicator" style="font-size:12px; color:gray; padding-left:15px; display:none;">Typing...</div>
    <div style="padding:10px; border-top:1px solid #eee;">
        <div style="display:flex; gap:8px; align-items:center;">
            <i class="fas fa-plus-circle" style="color:var(--main); cursor:pointer;"></i>
            <input type="text" id="msg-input" placeholder="Type..." style="flex:1; border:none; background:#f0f2f5; padding:10px; border-radius:20px; outline:none;">
            <i class="fas fa-paper-plane" onclick="sendMsg()" style="color:var(--main); cursor:pointer; font-size:20px;"></i>
        </div>
        <div style="display:flex; justify-content:space-around; margin-top:10px; font-size:14px; color:var(--gray);">
            <i class="fas fa-microphone" title="Send Audio"></i>
            <i class="fas fa-eye" id="view-once-btn" onclick="toggleViewOnce()" title="One-time View" style="cursor:pointer;"></i>
        </div>
    </div>
</div>
<audio id="beep-sound" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>
