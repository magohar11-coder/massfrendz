<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz Pro | M.A. Gohar</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21; --neon: #1877f2; --gold: #ffd700; --silver: #c0c0c0; --border: #ddd; }
        [data-theme="dark"] { --bg: #0a0b10; --card: #161b22; --text: #e6edf3; --neon: #00f3ff; --border: #30363d; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }

        /* Fixed Header & Footer */
        header { position: fixed; top: 0; width: 100%; height: 70px; background: var(--card); border-bottom: 3px solid var(--neon); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; box-sizing: border-box; }
        footer { position: fixed; bottom: 0; width: 100%; background: var(--card); border-top: 3px solid var(--neon); padding: 15px 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--neon); z-index: 1000; text-transform: uppercase; }
        
        .app-name { font-size: 32px; font-weight: 900; color: var(--neon); text-decoration: none; }

        .container { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 90px 20px 80px; max-width: 1400px; margin: auto; }
        .sidebar { position: sticky; top: 90px; height: calc(100vh - 180px); overflow-y: auto; }

        /* Stories Row */
        .stories-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; scrollbar-width: none; }
        .story-card { min-width: 100px; height: 150px; background: var(--border); border-radius: 12px; position: relative; overflow: hidden; border: 2px solid var(--neon); cursor: pointer; }
        
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        
        /* Reaction pop animation */
        .react-btn { border: none; background: none; cursor: pointer; font-size: 18px; transition: transform 0.2s; }
        .react-btn:active { transform: scale(1.4); }

        /* Chat Long Press Popup */
        .msg { padding: 10px; border-radius: 12px; margin: 5px; position: relative; cursor: pointer; user-select: none; }
        .del-tip { position: absolute; top: -30px; background: red; color: white; padding: 4px 8px; border-radius: 5px; font-size: 10px; display: none; }
        
        #chat-popup { position: fixed; bottom: 85px; right: 30px; width: 330px; height: 450px; background: var(--card); border: 2px solid var(--neon); border-radius: 12px; display: none; flex-direction: column; z-index: 2001; }
    </style>
</head>
<body data-theme="light">

    <header>
        <a href="#" class="app-name">MASSFRENDZ</a>
        <div style="display:flex; gap:10px;">
            <input type="text" id="searchInp" placeholder="Search friends..." style="padding:8px 15px; border-radius:20px; border:1px solid var(--border);">
            <div id="user-p-icon"></div>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="card">
                <h3>Global Users</h3>
                <div id="global-list">Loading...</div>
            </div>
            <div class="card">
                <h3>Friend Requests</h3>
                <div id="req-list">No requests.</div>
            </div>
        </div>

        <div class="feed">
            <div class="stories-row" id="stories-cont">
                <div class="story-card" onclick="document.getElementById('storyFile').click()">
                    <div style="padding:10px; text-align:center;">+<br>Add Story</div>
                    <input type="file" id="storyFile" hidden onchange="uploadStory(this)">
                </div>
            </div>

            <div class="card">
                <textarea id="postText" placeholder="What's on your mind, Gohar?" style="width:100%; border:none; outline:none; font-size:16px; background:transparent; color:inherit;"></textarea>
                <div id="preview-img" style="margin:10px 0;"></div>
                <hr style="border:0.5px solid var(--border);">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="cursor:pointer">🖼️ Photo <input type="file" id="postFile" hidden onchange="previewFile(this)"></label>
                    <select id="postPrivacy" style="background:var(--bg); color:inherit; border-radius:5px;">
                        <option value="public">🌍 Public</option>
                        <option value="friends">👥 Friends</option>
                    </select>
                    <button onclick="publishPost()" style="background:var(--neon); color:white; border:none; padding:8px 20px; border-radius:20px; cursor:pointer; font-weight:bold;">Post</button>
                </div>
            </div>
            <div id="feed-cont"></div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h3>My Friends</h3>
                <div id="friends-list">Add friends to chat!</div>
            </div>
            <button onclick="toggleTheme()" class="card" style="width:100%; cursor:pointer; font-weight:bold;">🌓 Switch Theme</button>
        </div>
    </div>

    <footer>Powered by M.A.GOHAR</footer>

    <div id="chat-popup">
        <div style="background:var(--neon); color:white; padding:10px; display:flex; justify-content:space-between; font-weight:bold;">
            <span id="chat-user-name">Chat</span>
            <span onclick="document.getElementById('chat-popup').style.display='none'" style="cursor:pointer">✖</span>
        </div>
        <div id="chat-msgs" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;"></div>
        <div style="padding:10px; display:flex; gap:5px; border-top:1px solid var(--border);">
            <input type="text" id="chatInp" placeholder="Aa" style="flex:1; padding:8px; border-radius:20px; border:1px solid var(--border);">
            <button onclick="sendMsg()" style="border:none; background:none; cursor:pointer; font-size:20px;">🚀</button>
        </div>
    </div>

    <script>
        // --- CONFIG FIX ---
        const firebaseConfig = {
            apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
            authDomain: "massfrendz.firebaseapp.com",
            databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/",
            projectId: "massfrendz",
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let me = null;
        let pressTimer;

        auth.onAuthStateChanged(user => {
            if (user) {
                me = user;
                db.ref('users/' + user.uid).set({ name: user.displayName, pic: user.photoURL, uid: user.uid });
                document.getElementById('user-p-icon').innerHTML = `<img src="${user.photoURL}" style="width:35px; border-radius:50%; border:2px solid var(--neon);">`;
                initApp();
            } else {
                auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
            }
        });

        function initApp() {
            loadFeed();
            loadGlobalUsers();
            loadFriendRequests();
            loadFriends();
            loadStories();
        }

        // --- POST WITH IMAGE FIX ---
        function previewFile(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('preview-img').innerHTML = `<img src="${e.target.result}" style="width:100%; border-radius:10px;">`;
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function publishPost() {
            const txt = document.getElementById('postText').value;
            const priv = document.getElementById('postPrivacy').value;
            const file = document.getElementById('postFile').files[0];
            let imgData = "";

            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    saveToDb(reader.result);
                };
            } else if (txt) {
                saveToDb("");
            }

            function saveToDb(img) {
                db.ref('posts').push({
                    uid: me.uid, name: me.displayName, pic: me.photoURL,
                    text: txt, image: img, privacy: priv,
                    gold: 0, silver: 0, time: Date.now()
                });
                document.getElementById('postText').value = "";
                document.getElementById('postFile').value = "";
                document.getElementById('preview-img').innerHTML = "";
            }
        }

        // --- UNDO REACTION SYSTEM ---
        window.react = (pid, type) => {
            const rRef = db.ref(`reactions/${pid}/${me.uid}`);
            rRef.once('value', s => {
                const pRef = db.ref(`posts/${pid}/${type}`);
                if (s.val() === type) {
                    pRef.transaction(c => Math.max(0, (c || 0) - 1));
                    rRef.remove();
                } else {
                    pRef.transaction(c => (c || 0) + 1);
                    rRef.set(type);
                }
            });
        };

        // --- CHAT LONG PRESS ---
        function showDel(mid, chatID, isMe) {
            const el = document.getElementById('tip-'+mid);
            el.style.display = 'block';
            el.onclick = () => {
                if(confirm("Delete message?")) {
                    db.ref(`chats/${chatID}/${mid}`).remove();
                }
            };
        }

        // --- UTILS ---
        window.toggleTheme = () => {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
        };

        // Loaders for global users, feed, friends etc. would go here (already provided in previous steps, just ensure ID match)
    </script>
</body>
</html>
