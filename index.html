<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz | Gohar Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    
    <style>
        :root { --fb-blue: #0084ff; --main: #00c853; --bg: #f0f2f5; }
        body { background: var(--bg); font-family: 'Segoe UI', Arial; margin: 0; }
        
        /* Navbar */
        nav { position: fixed; top: 0; width: 100%; height: 56px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-sizing: border-box; }
        .nav-left h2 { color: var(--main); margin: 0; }

        /* Main Feed */
        .main-content { margin-top: 70px; display: flex; justify-content: center; padding: 10px; }
        .feed { width: 100%; max-width: 500px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 15px; }

        /* FB Style Chat Window */
        .chat-window { position: fixed; bottom: 0; right: 20px; width: 330px; height: 450px; background: white; border-radius: 8px 8px 0 0; box-shadow: 0 12px 28px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; }
        
        /* Blue Action Bar for Selection */
        .action-bar { background: var(--fb-blue); color: white; padding: 10px; display: none; justify-content: space-between; align-items: center; font-size: 14px; border-radius: 8px 8px 0 0; }
        .unsend-btn { background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .chat-header { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .chat-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #fff; }
        
        /* Messenger Bubbles */
        .msg { padding: 8px 12px; border-radius: 18px; max-width: 75%; font-size: 14px; cursor: pointer; position: relative; }
        .msg-me { background: var(--fb-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-them { background: #e4e6e9; color: black; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-selected { border: 2px solid #ffc107; opacity: 0.8; }

        .chat-footer { padding: 10px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .chat-footer input { flex: 1; border: none; background: #f0f2f5; padding: 8px 15px; border-radius: 20px; outline: none; }
        .footer-icons { color: var(--fb-blue); font-size: 18px; cursor: pointer; display: flex; gap: 10px; }
        
        .media-content { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        .status-tick { font-size: 10px; display: block; text-align: right; opacity: 0.7; margin-top: 2px; }
    </style>
</head>
<body>

<div id="login-screen" style="height:100vh; display:flex; align-items:center; justify-content:center;">
    <button onclick="login()" style="padding:15px 30px; background:var(--fb-blue); color:white; border:none; border-radius:5px; cursor:pointer;">Login with Google</button>
</div>

<div id="main-app" style="display:none;">
    <nav><div class="nav-left"><h2>MASSFRENDZ</h2></div></nav>
    <div class="main-content">
        <div class="feed" id="post-list"></div>
    </div>
</div>

<script>
    // Original Firebase Config
    const firebaseConfig = { apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA", authDomain: "massfrendz.firebaseapp.com", databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/", projectId: "massfrendz" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.database();
    
    let me = null;
    let selectedMsgs = {};

    auth.onAuthStateChanged(user => {
        if(user) {
            me = user;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('main-app').style.display='block';
            db.ref('users/'+user.uid).update({n:user.displayName, p:user.photoURL});
            loadPosts();
        }
    });

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    function openChat(uid, name) {
        let chatID = me.uid < uid ? me.uid+"_"+uid : uid+"_"+me.uid;
        if(document.getElementById('win-'+chatID)) return;
        selectedMsgs[chatID] = [];

        let win = document.createElement('div');
        win.id = 'win-'+chatID; win.className = 'chat-window';
        win.innerHTML = `
            <div id="bar-${chatID}" class="action-bar">
                <span id="count-${chatID}">0 Selected</span>
                <div class="unsend-btn" id="del-btn-${chatID}" onclick="handleDeleteEvery('${chatID}')">Delete for Everyone</div>
            </div>
            <div class="chat-header" id="head-${chatID}">
                <b>${name}</b>
                <span onclick="this.parentElement.parentElement.remove()" style="cursor:pointer;">&times;</span>
            </div>
            <div id="body-${chatID}" class="chat-body"></div>
            <div class="chat-footer">
                <div class="footer-icons">
                    <label><i class="fas fa-image"></i><input type="file" accept="image/*" hidden onchange="sendMedia('${chatID}', this, 'image')"></label>
                    <label><i class="fas fa-video"></i><input type="file" accept="video/*" hidden onchange="sendMedia('${chatID}', this, 'video')"></label>
                </div>
                <input id="in-${chatID}" placeholder="Aa" onkeypress="if(event.key=='Enter') sendChat('${chatID}')">
                <i class="fas fa-paper-plane" style="color:var(--fb-blue); cursor:pointer;" onclick="sendChat('${chatID}')"></i>
            </div>`;
        document.body.appendChild(win);

        db.ref('msgs/'+chatID).on('value', s => {
            let body = document.getElementById('body-'+chatID); if(!body) return;
            body.innerHTML = "";
            s.forEach(m => {
                let d = m.val(); let isMe = d.s === me.uid;
                if(!isMe && d.st !== 'seen') db.ref('msgs/'+chatID+'/'+m.key).update({st:'seen'});

                let mDiv = document.createElement('div');
                mDiv.id = 'msg-'+m.key; mDiv.className = `msg ${isMe?'msg-me':'msg-them'}`;
                
                if(d.type==='image') mDiv.innerHTML=`<img src="${d.t}" class="media-content">`;
                else if(d.type==='video') mDiv.innerHTML=`<video src="${d.t}" controls class="media-content"></video>`;
                else mDiv.innerText = d.t;

                if(isMe) mDiv.innerHTML += `<span class="status-tick">${d.st==='seen'?'Seen':'Sent'}</span>`;
                
                mDiv.onclick = () => toggleMsg(m.key, chatID, isMe, d.ts);
                body.appendChild(mDiv);
            });
            body.scrollTop = body.scrollHeight;
        });
    }

    function toggleMsg(mid, cid, isMe, ts) {
        let idx = selectedMsgs[cid].indexOf(mid);
        let el = document.getElementById('msg-'+mid);
        if(idx > -1) { selectedMsgs[cid].splice(idx,1); el.classList.remove('msg-selected'); }
        else { selectedMsgs[cid].push(mid); el.classList.add('msg-selected'); }

        let bar = document.getElementById('bar-'+cid);
        let head = document.getElementById('head-'+cid);
        let delBtn = document.getElementById('del-btn-'+cid);
        
        if(selectedMsgs[cid].length > 0) {
            bar.style.display = 'flex'; head.style.display = 'none';
            document.getElementById('count-'+cid).innerText = selectedMsgs[cid].length + " Selected";
            // Show delete only if it's my message and under 10 mins
            let isRecent = (Date.now() - ts) < 600000;
            delBtn.style.display = (isMe && isRecent) ? 'block' : 'none';
        } else {
            bar.style.display = 'none'; head.style.display = 'flex';
        }
    }

    function handleDeleteEvery(cid) {
        selectedMsgs[cid].forEach(mid => db.ref('msgs/'+cid+'/'+mid).remove());
        selectedMsgs[cid] = []; 
        document.getElementById('bar-'+cid).style.display = 'none';
        document.getElementById('head-'+cid).style.display = 'flex';
    }

    function sendChat(cid) {
        let i = document.getElementById('in-'+cid);
        if(i.value) {
            db.ref('msgs/'+cid).push({s:me.uid, t:i.value, type:'text', ts:Date.now(), st:'sent'});
            i.value = "";
        }
    }

    function sendMedia(cid, input, type) {
        let file = input.files[0];
        let reader = new FileReader();
        reader.onload = e => db.ref('msgs/'+cid).push({s:me.uid, t:e.target.result, type:type, ts:Date.now(), st:'sent'});
        reader.readAsDataURL(file);
    }

    function loadPosts() {
        db.ref('posts').on('value', s => {
            const list = document.getElementById('post-list'); list.innerHTML = "";
            s.forEach(x => {
                let p = x.val();
                list.innerHTML = `<div class="card"><b>${p.n}</b><p>${p.t}</p><button onclick="openChat('${p.uid}','${p.n}')" style="background:var(--fb-blue); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Message</button></div>` + list.innerHTML;
            });
        });
    }
</script>
</body>
</html>
