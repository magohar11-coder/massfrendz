<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz | Advanced Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    
    <style>
        :root { --main: #00c853; --fb-blue: #1877f2; --bg: #f0f2f5; }
        body { background: var(--bg); font-family: 'Segoe UI', Arial; margin: 0; }
        nav { position: fixed; top: 0; width: 100%; height: 56px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-sizing: border-box; }
        .nav-left { display: flex; align-items: center; gap: 10px; flex: 1; }
        .search-box { background: #f0f2f5; border-radius: 20px; padding: 5px 12px; display: flex; align-items: center; width: 200px; }
        .search-box input { border: none; background: transparent; outline: none; padding-left: 5px; width: 100%; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .notif-bell { position: relative; cursor: pointer; font-size: 20px; color: #65676b; }
        .notif-count { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; display: none; }
        .main-content { margin-top: 70px; display: flex; justify-content: center; gap: 20px; }
        .feed { width: 100%; max-width: 500px; padding: 10px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .notif-dropdown { position: absolute; top: 50px; right: 20px; width: 300px; background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-radius: 8px; display: none; flex-direction: column; padding: 10px; z-index: 3000; }
        .req-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .req-btn { padding: 4px 10px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; }
        .chat-window { position: fixed; bottom: 0; right: 20px; width: 330px; height: 450px; background: white; border-radius: 8px 8px 0 0; box-shadow: 0 12px 28px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; }
        .chat-header { background: white; border-bottom: 1px solid #ddd; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0; }
        .action-bar { background: var(--fb-blue); color: white; padding: 8px 12px; display: none; justify-content: space-between; align-items: center; font-size: 13px; }
        .chat-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
        .msg-bubble { padding: 8px 12px; border-radius: 18px; max-width: 75%; font-size: 14px; cursor: pointer; position: relative; }
        .msg-me { background: var(--fb-blue); color: white; align-self: flex-end; }
        .msg-them { background: #e4e6e9; color: black; align-self: flex-start; }
        .msg-selected { border: 2px solid #ffc107 !important; }
        .status-tag { font-size: 9px; display: block; text-align: right; margin-top: 2px; opacity: 0.8; }
        .chat-footer { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
        .chat-footer input[type="text"] { flex: 1; border: none; background: #f0f2f5; padding: 8px 15px; border-radius: 20px; outline: none; }
        .chat-img, .chat-vid { max-width: 100%; border-radius: 10px; display: block; }
    </style>
</head>
<body>

<div id="login-screen" style="height:100vh; display:flex; align-items:center; justify-content:center; background:white;">
    <button onclick="login()" style="padding:15px 30px; background:var(--fb-blue); color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Login with Google</button>
</div>

<div id="main-app" style="display:none;">
    <nav>
        <div class="nav-left">
            <h2 style="color:var(--main); margin:0;">MF</h2>
            <div class="search-box">
                <i class="fas fa-search" style="color:gray;"></i>
                <input type="text" id="user-search" placeholder="Search friends..." oninput="searchUsers(this.value)">
            </div>
        </div>
        <div class="nav-right">
            <div class="notif-bell" onclick="toggleNotif()">
                <i class="fas fa-bell"></i>
                <span id="bell-count" class="notif-count">0</span>
            </div>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer;"></i>
        </div>
    </nav>

    <div id="notif-box" class="notif-dropdown"><b style="padding: 5px;">Requests</b><div id="req-list"></div></div>

    <div class="main-content">
        <div class="feed">
            <div id="search-results" class="card" style="display:none;"><b>Results</b><div id="results-list"></div></div>
            <div class="card">
                <textarea id="post-text" placeholder="What's on your mind?" style="width:100%; border:none; background:#f0f2f5; padding:10px; border-radius:8px; outline:none; resize:none;"></textarea>
                <img id="post-img-prev" style="width:100%; border-radius:8px; display:none; margin-top:10px;">
                <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                    <label style="color:var(--main); cursor:pointer;"><i class="fas fa-image"></i> Photo <input type="file" id="post-file" hidden onchange="previewFile(this, 'post-img-prev')"></label>
                    <button id="post-btn" onclick="submitPost()" style="background:var(--main); color:white; border:none; padding:8px 20px; border-radius:5px; cursor:pointer;">Post</button>
                </div>
            </div>
            <div id="post-list"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA", authDomain: "massfrendz.firebaseapp.com", databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/", projectId: "massfrendz" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.database();
    let me = null; let selectedMsgs = {}; let postMediaData = "";

    auth.onAuthStateChanged(user => {
        if(user) {
            me = user;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('main-app').style.display='block';
            db.ref('users/'+user.uid).update({n:user.displayName, p:user.photoURL});
            loadPosts(); listenRequests();
        }
    });

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut().then(() => location.reload()); }

    function openChat(uid, name) {
        let chatID = me.uid < uid ? me.uid+"_"+uid : uid+"_"+me.uid;
        if(document.getElementById('win-'+chatID)) return;
        selectedMsgs[chatID] = [];
        let win = document.createElement('div');
        win.id = 'win-'+chatID; win.className = 'chat-window';
        win.innerHTML = `<div id="bar-${chatID}" class="action-bar"><span id="count-${chatID}">0 Selected</span><span id="unsend-btn-${chatID}" onclick="handleUnsend('${chatID}')" style="cursor:pointer; font-weight:bold;">Unsend</span></div><div class="chat-header"><b>${name}</b><span onclick="this.parentElement.parentElement.remove()" style="cursor:pointer;">&times;</span></div><div id="body-${chatID}" class="chat-body"></div><div class="chat-footer"><label><i class="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" hidden onchange="sendMediaChat('${chatID}', this)"></label><input id="in-${chatID}" placeholder="Aa" onkeypress="if(event.key=='Enter') sendChat('${chatID}')"></div>`;
        document.body.appendChild(win);
        
        db.ref('msgs/'+chatID).on('value', s => {
            let body = document.getElementById('body-'+chatID); if(!body) return;
            body.innerHTML = "";
            s.forEach(m => {
                let d = m.val(); let isMe = d.s === me.uid;
                
                // Real-time Seen Logic
                if(!isMe && d.st !== 'seen') db.ref('msgs/'+chatID+'/'+m.key).update({st: 'seen'});

                let mDiv = document.createElement('div');
                mDiv.id = 'msg-'+m.key; mDiv.className = `msg-bubble ${isMe?'msg-me':'msg-them'}`;
                
                let timeLimit = 600000; // 10 Minutes
                let stillDeletable = (Date.now() - d.ts) < timeLimit;

                if(d.type==='media') mDiv.innerHTML=`<img src="${d.t}" class="chat-img">`;
                else if(d.type==='video') mDiv.innerHTML=`<video src="${d.t}" controls class="chat-vid"></video>`;
                else mDiv.innerText=d.t;
                
                if(isMe) mDiv.innerHTML += `<span class="status-tag">${d.st === 'seen' ? 'Seen' : 'Sent'}</span>`;

                mDiv.onclick = () => toggleMsg(m.key, chatID, isMe, stillDeletable);
                body.appendChild(mDiv);
            });
            body.scrollTop = body.scrollHeight;
        });
    }

    function toggleMsg(mid, cid, isMe, deletable) {
        let idx = selectedMsgs[cid].indexOf(mid);
        let el = document.getElementById('msg-'+mid);
        if(idx > -1) { selectedMsgs[cid].splice(idx,1); el.classList.remove('msg-selected'); }
        else { selectedMsgs[cid].push(mid); el.classList.add('msg-selected'); }
        
        let bar = document.getElementById('bar-'+cid);
        let btn = document.getElementById('unsend-btn-'+cid);
        bar.style.display = selectedMsgs[cid].length > 0 ? 'flex' : 'none';
        
        // Ownership & Time Logic: Sirf apna message aur 10 min ke andar hi Unsend dikhega
        btn.style.display = (isMe && deletable) ? 'block' : 'none';
        document.getElementById('count-'+cid).innerText = selectedMsgs[cid].length + " Selected";
    }

    function handleUnsend(cid) {
        selectedMsgs[cid].forEach(mid => db.ref('msgs/'+cid+'/'+mid).remove());
        selectedMsgs[cid] = []; document.getElementById('bar-'+cid).style.display = 'none';
    }

    function sendChat(cid) {
        let i = document.getElementById('in-'+cid);
        if(i.value) { db.ref('msgs/'+cid).push({s:me.uid, t:i.value, type:'text', ts:Date.now(), st:'sent'}); i.value=""; }
    }

    function sendMediaChat(cid, input) {
        const file = input.files[0];
        if(!file) return;
        if(file.size > 5242880) { alert("File too big! Keep it under 5MB"); return; } // 5MB Limit

        const reader = new FileReader();
        const type = file.type.startsWith('video') ? 'video' : 'media';
        reader.onload = e => db.ref('msgs/'+cid).push({s:me.uid, t:e.target.result, type:type, ts:Date.now(), st:'sent'});
        reader.readAsDataURL(file);
    }

    // --- Search, Requests, Posts (Same as your base code) ---
    function searchUsers(v) { /* Same logic as before */ }
    function listenRequests() { /* Same logic as before */ }
    function submitPost() { /* Same logic as before */ }
    function loadPosts() { /* Same logic as before */ }
</script>
</body>
</html>
