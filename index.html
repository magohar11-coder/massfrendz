<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massfrendz Cyber | M.A. Gohar</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        /* UNIQUE CYBER THEME */
        :root { --neon-purple: #bc13fe; --neon-blue: #00f3ff; --dark-bg: #0d0221; --glass: rgba(255, 255, 255, 0.1); --text: #ffffff; }
        body { background: var(--dark-bg); color: var(--text); font-family: 'Orbitron', sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }

        header { background: rgba(13, 2, 33, 0.9); border-bottom: 2px solid var(--neon-purple); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 0 15px var(--neon-purple); }
        .logo { font-size: 20px; font-weight: 900; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 500px; margin: auto; padding: 15px; }
        
        /* Glassmorphism Cards */
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; margin-bottom: 15px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); }

        /* Search Bar Cyber Look */
        #searchBox { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--neon-blue); border-radius: 30px; color: white; margin-bottom: 15px; box-sizing: border-box; }

        /* Story Neon Rounds */
        .story-tray { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .story-ring { min-width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--neon-purple); padding: 3px; cursor: pointer; position: relative; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* Buttons */
        .neon-btn { background: transparent; border: 1px solid var(--neon-purple); color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .neon-btn:hover { background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }

        /* Personal Chat Window */
        #chat-win { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); z-index: 5000; display: none; flex-direction: column; }
        .chat-top { padding: 15px; border-bottom: 1px solid var(--neon-blue); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); }
        .call-btns { display: flex; gap: 15px; font-size: 20px; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px; border-radius: 15px; max-width: 70%; line-height: 1.4; }
        .me { background: var(--neon-purple); align-self: flex-end; box-shadow: 0 0 8px var(--neon-purple); }
        .them { background: rgba(255,255,255,0.1); align-self: flex-start; }

        .bottom-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(13, 2, 33, 0.95); border-top: 2px solid var(--neon-blue); display: flex; justify-content: space-around; align-items: center; }
        .nav-icon { font-size: 24px; cursor: pointer; color: var(--neon-blue); }
    </style>
</head>
<body>

<header>
    <div class="logo">MASSFRENDZ_XP</div>
    <div style="display:flex; gap:10px;">
        <span onclick="logout()" style="cursor:pointer; color:red; font-size:12px;">SHUTDOWN</span>
        <img id="my-p" style="width:35px; height:35px; border-radius:50%; border:1px solid var(--neon-blue);">
    </div>
</header>

<div class="container">
    <input type="text" id="searchBox" placeholder="SEARCH GLOBAL USERS..." oninput="findUser(this.value)">

    <div class="story-tray">
        <div class="story-ring" onclick="document.getElementById('sInp').click()" style="display:flex; align-items:center; justify-content:center; font-size:25px; border-style:dashed;">+</div>
        <input type="file" id="sInp" hidden onchange="upStory(this)">
        <div id="story-list" style="display:flex; gap:10px;"></div>
    </div>

    <div class="glass-card">
        <textarea id="pTxt" placeholder="BROADCAST YOUR THOUGHTS..." style="width:100%; background:transparent; border:none; color:white; outline:none; height:60px;"></textarea>
        <div id="pPre"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <input type="file" id="pImg" hidden onchange="preImg(this)">
            <button onclick="document.getElementById('pImg').click()" class="neon-btn">IMAGE</button>
            <button class="neon-btn" onclick="sendPost()">POST</button>
        </div>
    </div>

    <div id="feed"></div>
</div>

<div id="chat-win">
    <div class="chat-header chat-top">
        <b onclick="closeChat()">← BACK</b>
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="c-dp" style="width:35px; height:35px; border-radius:50%;">
            <span id="c-name">USER</span>
        </div>
        <div class="call-btns">
            <span onclick="alert('Starting Audio Call...')">📞</span>
            <span onclick="alert('Starting Video Call...')">📹</span>
        </div>
    </div>
    <div id="msgs"></div>
    <div style="padding:15px; display:flex; gap:10px; background:rgba(255,255,255,0.05);">
        <input type="text" id="mInp" placeholder="Enter signal..." style="flex:1; background:transparent; border:1px solid var(--neon-purple); color:white; padding:12px; border-radius:10px;">
        <button onclick="sendMsg()" class="neon-btn">SEND</button>
    </div>
</div>

<div class="bottom-bar">
    <div class="nav-icon">🏠</div>
    <div class="nav-icon" onclick="alert('Opening Friend Requests')">👥</div>
    <div class="nav-icon" onclick="alert('Inbox Notifications')">🔔</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
        authDomain: "massfrendz.firebaseapp.com",
        databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/",
        projectId: "massfrendz"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.database();
    let me = null; let chat_id = null;

    auth.onAuthStateChanged(user => {
        if(user) {
            me = user;
            db.ref('users/'+user.uid).on('value', s => {
                const d = s.val() || { name: user.displayName, pic: user.photoURL, uid: user.uid };
                document.getElementById('my-p').src = d.pic;
                if(!s.val()) db.ref('users/'+user.uid).set(d);
            });
            startEngine();
        } else { auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
    });

    // CHAT & DELETE
    window.openChat = (uid, name, pic) => {
        chat_id = me.uid < uid ? me.uid+uid : uid+me.uid;
        document.getElementById('c-name').innerText = name;
        document.getElementById('c-dp').src = pic;
        document.getElementById('chat-win').style.display = 'flex';
        db.ref('chats/'+chat_id).on('value', snap => {
            const cont = document.getElementById('msgs'); cont.innerHTML = "";
            snap.forEach(c => {
                const m = c.val();
                cont.innerHTML += `<div class="bubble ${m.s===me.uid?'me':'them'}" oncontextmenu="delM('${c.key}')">${m.t}</div>`;
            });
            cont.scrollTop = cont.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const t = document.getElementById('mInp').value;
        if(t) { db.ref('chats/'+chat_id).push({ s: me.uid, t: t, time: Date.now() }); document.getElementById('mInp').value = ""; }
    };

    window.delM = (mid) => { if(confirm("ERASE MESSAGE?")) db.ref(`chats/${chat_id}/${mid}`).update({t: "MESSAGE TERMINATED"}); };

    // SEARCH & FEED
    window.findUser = (v) => {
        if(!v) { startEngine(); return; }
        db.ref('users').orderByChild('name').startAt(v).endAt(v+"\uf8ff").once('value', snap => {
            const f = document.getElementById('feed'); f.innerHTML = "<h4>RESULTS:</h4>";
            snap.forEach(u => {
                f.innerHTML += `<div class="glass-card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:10px;"><img src="${u.val().pic}" class="story-ring" style="width:30px; height:30px;"> ${u.val().name}</div>
                    <button class="neon-btn" onclick="sendR('${u.key}')">CONNECT</button>
                </div>`;
            });
        });
    };

    function startEngine() {
        db.ref('posts').on('value', snap => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            snap.forEach(c => {
                const p = c.val();
                f.innerHTML = `<div class="glass-card">
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;" onclick="openChat('${p.uid}','${p.name}','${p.pic}')">
                        <img src="${p.pic}" style="width:35px; height:35px; border-radius:50%; border:1px solid var(--neon-blue);"> <b>${p.name}</b>
                    </div>
                    <p>${p.text}</p>
                    ${p.image ? `<img src="${p.image}" style="width:100%; border-radius:10px; border:1px solid var(--glass);">` : ''}
                </div>` + f.innerHTML;
            });
        });

        db.ref('stories').on('value', snap => {
            const s = document.getElementById('story-list'); s.innerHTML = "";
            snap.forEach(v => {
                s.innerHTML += `<div class="story-ring"><img src="${v.val().img}"></div>`;
            });
        });
    }

    window.sendPost = () => {
        const t = document.getElementById('pTxt').value;
        const file = document.getElementById('pImg').files[0];
        const push = (img="") => {
            db.ref('posts').push({ uid: me.uid, name: me.displayName, pic: document.getElementById('my-p').src, text: t, image: img, time: Date.now() });
            document.getElementById('pTxt').value = ""; document.getElementById('pPre').innerHTML = "";
        };
        if(file) { const r = new FileReader(); r.onload=()=>push(r.result); r.readAsDataURL(file); } else if(t) push();
    };

    window.logout = () => { if(confirm("TERMINATE SESSION?")) auth.signOut().then(()=>location.reload()); };
    window.closeChat = () => document.getElementById('chat-win').style.display = 'none';
    window.preImg = (i) => { if(i.files[0]) { const r = new FileReader(); r.onload=e=>document.getElementById('pPre').innerHTML=`<img src="${e.target.result}" style="width:100%; border-radius:10px;">`; r.readAsDataURL(i.files[0]); } };
    window.upStory = (i) => { if(i.files[0]) { const r = new FileReader(); r.onload=e=>db.ref('stories/'+me.uid).set({img: e.target.result}); r.readAsDataURL(i.files[0]); } };
</script>
</body>
</html>
