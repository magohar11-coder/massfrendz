<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massfrendz | Gohar Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    
    <style>
        :root {
            --main: #00c853; 
            --bg: #f0f2f5; 
            --card: #ffffff; 
            --text-dark: #1c1e21;
            --text-light: #65676b;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Top Navigation */
        nav { 
            position: fixed; top: 0; width: 100%; height: 56px; 
            background: var(--card); border-bottom: 1px solid #ddd;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000; box-sizing: border-box;
        }

        .search-container {
            background: #f0f2f5; padding: 8px 12px; border-radius: 20px;
            display: flex; align-items: center; width: 250px;
        }
        
        .search-container input {
            background: transparent; border: none; outline: none; margin-left: 8px; width: 100%;
        }

        /* Sidebar Desktop */
        .sidebar {
            position: fixed; left: 0; top: 56px; width: 280px; height: calc(100vh - 56px);
            padding: 16px; overflow-y: auto; background: var(--bg);
        }

        .side-item {
            display: flex; align-items: center; gap: 12px; padding: 10px;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }

        .side-item:hover { background: #e4e6e9; }
        
        .side-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

        /* Main Content Area */
        .main-content {
            margin-left: 300px; margin-right: 320px; margin-top: 72px; padding: 0 16px;
        }

        /* Post Card */
        .card {
            background: var(--card); border-radius: 8px; padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 16px;
            max-width: 600px; margin-left: auto; margin-right: auto;
        }

        /* Feed Image Fix */
        .post-img-content {
            width: 100%; max-height: 500px; object-fit: contain; 
            border-radius: 4px; margin-top: 10px; background: #000;
        }

        /* Buttons */
        .btn-post {
            background: var(--main); color: white; border: none;
            padding: 8px 20px; border-radius: 6px; font-weight: bold;
            cursor: pointer;
        }

        /* Online Panel */
        .online-panel {
            position: fixed; right: 0; top: 56px; width: 300px; height: calc(100vh - 56px);
            padding: 16px; border-left: 1px solid #ddd; background: var(--bg);
        }

        /* Chat Styles */
        .chat-float { position: fixed; bottom: 0; right: 320px; width: 280px; height: 350px; background: white; border-radius: 8px 8px 0 0; box-shadow: 0 0 10px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; }
        .chat-header { background: var(--main); color: white; padding: 10px; display: flex; justify-content: space-between; border-radius: 8px 8px 0 0; }
        .chat-msgs-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; background: #f9f9f9; }
        .chat-input-area { padding: 8px; border-top: 1px solid #eee; display: flex; gap: 5px; }
        .chat-input-area input { flex: 1; border: none; background: #f0f2f5; padding: 8px 12px; border-radius: 15px; outline: none; }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .sidebar, .online-panel { display: none; }
            .main-content { margin: 70px 10px; }
            .card { width: 100%; }
        }
    </style>
</head>
<body>

<nav>
    <div style="display: flex; align-items: center; gap: 10px;">
        <h2 style="color: var(--main); margin: 0; letter-spacing: -1px; font-family: 'Arial Black';">MASSFRENDZ</h2>
        <div class="search-container">
            <i class="fas fa-search" style="color: gray;"></i>
            <input type="text" placeholder="Search friends...">
        </div>
    </div>
    
    <div style="display: flex; gap: 15px; align-items: center;">
        <div style="position: relative; cursor: pointer;">
            <i class="fas fa-bell" style="font-size: 20px;"></i>
            <span id="notif-count" style="position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%;">0</span>
        </div>
        <img id="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 1px solid #ddd;">
    </div>
</nav>

<div class="sidebar">
    <div class="side-item" onclick="openProfile()">
        <img id="side-dp" class="side-img" src="https://via.placeholder.com/36">
        <b id="side-name">Loading...</b>
    </div>
    <div class="side-item" onclick="showFriends()">
        <i class="fas fa-user-friends" style="color: #1877f2; font-size: 24px;"></i> <b>Friends</b>
    </div>
    <hr style="opacity: 0.1;">
    <p style="color: gray; font-size: 13px;">Powered by M.A. Gohar</p>
</div>

<div class="main-content">
    <div class="card">
        <div style="display: flex; gap: 10px;">
            <img id="post-avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
            <textarea id="post-input" placeholder="What's on your mind, Gohar?" style="flex: 1; border: none; background: #f0f2f5; padding: 12px; border-radius: 20px; outline: none; resize: none; font-size: 16px; height: 50px;"></textarea>
        </div>
        
        <div id="image-preview-container" style="margin-top: 10px; display: none; position: relative;">
            <img id="post-image-preview" style="width: 100%; border-radius: 8px; border: 1px solid #ddd;">
            <i class="fas fa-times-circle" onclick="removeSelectedImg()" style="position: absolute; top: 5px; right: 5px; color: white; font-size: 20px; cursor: pointer;"></i>
        </div>

        <hr style="opacity: 0.1; margin: 15px 0;">
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="cursor: pointer; color: #45bd62; font-weight: 600; display: flex; align-items: center; gap: 5px;">
                <i class="fas fa-image" style="font-size: 20px;"></i> Photo
                <input type="file" id="file-input" hidden accept="image/*" onchange="previewPostImage(this)">
            </label>
            <button class="btn-post" onclick="submitPost()">Post</button>
        </div>
    </div>

    <div id="main-feed">
        <div style="text-align: center; color: gray; margin-top: 50px;">
            <i class="fas fa-spinner fa-spin"></i> Loading Feed...
        </div>
    </div>
</div>

<div class="online-panel">
    <b style="color: var(--text-light); display: block; margin-bottom: 10px;">Contacts</b>
    <div id="online-users-list"></div>
</div>

<audio id="notif-sound" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>

<script>
    // 1. CONFIG
    const firebaseConfig = { 
        apiKey: "AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA", 
        authDomain: "massfrendz.firebaseapp.com", 
        databaseURL: "https://massfrendz-default-rtdb.firebaseio.com/", 
        projectId: "massfrendz" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); 
    const db = firebase.database();
    
    let me = null;
    let selectedPostImg = "";

    // 2. AUTH
    auth.onAuthStateChanged(user => {
        if(user) {
            me = user;
            updateProfileUI();
            db.ref('users/' + user.uid).update({
                n: user.displayName,
                p: user.photoURL,
                online: true
            });
            loadPosts();
            loadOnlineUsers();
        } else {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }
    });

    function updateProfileUI() {
        const dp = me.photoURL || 'https://via.placeholder.com/40';
        document.getElementById('user-avatar').src = dp;
        document.getElementById('side-dp').src = dp;
        document.getElementById('post-avatar').src = dp;
        document.getElementById('side-name').innerText = me.displayName;
    }

    // 3. IMAGE LOGIC
    window.previewPostImage = (input) => {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedPostImg = e.target.result;
                document.getElementById('post-image-preview').src = selectedPostImg;
                document.getElementById('image-preview-container').style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    window.removeSelectedImg = () => {
        selectedPostImg = "";
        document.getElementById('image-preview-container').style.display = 'none';
    };

    // 4. SUBMIT POST
    window.submitPost = () => {
        const text = document.getElementById('post-input').value;
        if(text || selectedPostImg) {
            const postData = {
                uid: me.uid, n: me.displayName, p: me.photoURL,
                t: text, img: selectedPostImg, ts: Date.now()
            };
            db.ref('posts').push(postData);
            document.getElementById('post-input').value = "";
            removeSelectedImg();
        }
    };

    // 5. LOAD FEED (Optimized)
    function loadPosts() {
        db.ref('posts').on('value', snapshot => {
            const feed = document.getElementById('main-feed');
            let allHTML = "";
            let posts = [];
            snapshot.forEach(child => { posts.push({id: child.key, ...child.val()}); });
            
            posts.reverse().forEach(post => {
                allHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; gap:10px; align-items:center;">
                            <img src="${post.p}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                            <div>
                                <b style="display:block;">${post.n}</b>
                                <small style="color:gray;">${new Date(post.ts).toLocaleTimeString()}</small>
                            </div>
                        </div>
                        ${post.uid === me.uid ? `<i class="fas fa-trash-alt" onclick="deletePost('${post.id}')" style="color:#ff4d4d; cursor:pointer;"></i>` : ''}
                    </div>
                    <div style="margin-top:12px; font-size:16px;">${post.t}</div>
                    ${post.img ? `<img src="${post.img}" class="post-img-content">` : ''}
                    <hr style="opacity:0.1; margin:12px 0;">
                    <div style="display:flex; justify-content:space-around; font-weight:bold; color:var(--text-light); cursor:pointer;">
                        <div onclick="likePost('${post.id}')"><i class="far fa-thumbs-up"></i> Like</div>
                        <div onclick="openChat('${post.uid}', '${post.n}', '${post.p}')"><i class="far fa-comment"></i> Chat</div>
                        <div><i class="far fa-share-square"></i> Share</div>
                    </div>
                </div>`;
            });
            feed.innerHTML = allHTML || "<p style='text-align:center;'>No posts yet</p>";
        });
    }

    window.deletePost = (id) => { if(confirm("Delete this post?")) db.ref('posts/' + id).remove(); };

    // 6. CHAT & ONLINE
    window.openChat = (uid, name, img) => {
        if(uid === me.uid) return;
        const chatID = me.uid < uid ? me.uid + "_" + uid : uid + "_" + me.uid;
        if(document.getElementById('chat-window-' + chatID)) return;

        const div = document.createElement('div');
        div.id = 'chat-window-' + chatID;
        div.className = 'chat-float';
        div.innerHTML = `
            <div class="chat-header">
                <b>${name}</b>
                <span onclick="this.parentElement.parentElement.remove()" style="cursor:pointer;">&times;</span>
            </div>
            <div id="msgs-${chatID}" class="chat-msgs-area"></div>
            <div class="chat-input-area">
                <input type="text" id="input-${chatID}" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage('${chatID}')">
            </div>`;
        document.body.appendChild(div);
        
        db.ref('msgs/' + chatID).on('value', s => {
            const box = document.getElementById('msgs-' + chatID);
            if(!box) return; box.innerHTML = "";
            s.forEach(m => {
                const d = m.val();
                box.innerHTML += `<div style="padding:5px 10px; border-radius:10px; margin:2px; background:${d.s===me.uid?'var(--main)':'#eee'}; color:${d.s===me.uid?'white':'black'}; align-self:${d.s===me.uid?'flex-end':'flex-start'}; max-width:80%; font-size:14px;">${d.t}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.sendMessage = (cID) => {
        const inp = document.getElementById('input-' + cID);
        if(inp.value) { db.ref('msgs/' + cID).push({ s: me.uid, t: inp.value, ts: Date.now() }); inp.value = ""; }
    };

    function loadOnlineUsers() {
        db.ref('users').on('value', s => {
            const list = document.getElementById('online-users-list');
            list.innerHTML = "";
            s.forEach(u => {
                if(u.key !== me.uid) {
                    list.innerHTML += `<div class="side-item" onclick="openChat('${u.key}', '${u.val().n}', '${u.val().p}')">
                        <img src="${u.val().p}" class="side-img">
                        <b>${u.val().n}</b>
                    </div>`;
                }
            });
        });
    }
</script>
</body>
</html>
