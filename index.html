<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassFrendz</title>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>
body{
margin:0;font-family:Arial;
background:url("https://images.unsplash.com/photo-1529333166437-7750a6dd5a70") center/cover no-repeat fixed;
min-height:100vh;
}

#loginScreen{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

#app{
display:none;
background:#f0f2f5;
min-height:100vh;
}

nav{
height:60px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
position:sticky;top:0;
}

.container{max-width:500px;margin:auto;padding:10px}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

button{
padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00c853;
color:white;
font-weight:bold;
}

.friend{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.friend img{
width:35px;height:35px;border-radius:50%;
}

.chat{
position:fixed;
bottom:0;right:10px;
width:300px;height:380px;
background:white;
border-radius:10px 10px 0 0;
display:flex;flex-direction:column;
box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.chat-body{
flex:1;
overflow:auto;
padding:10px;
background:#eee;
}

.msg-me{align-self:flex-end;background:#0084ff;color:white;padding:6px 10px;border-radius:12px}
.msg-them{align-self:flex-start;background:white;padding:6px 10px;border-radius:12px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<button onclick="login()">Login with Google</button>
</div>

<!-- APP -->
<div id="app">
<nav>
<b>MassFrendz</b>
<div>
<span id="myName"></span>
<button onclick="logout()" style="background:red">Logout</button>
</div>
</nav>

<div class="container">

<div class="card">
<textarea id="postTxt" placeholder="What's on your mind?" style="width:100%"></textarea>
<button onclick="addPost()">Post</button>
</div>

<div class="card">
<b>Friends</b>
<div id="friends"></div>
</div>

<div id="posts"></div>

</div>
</div>

<div id="chatBox"></div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAuGZse8FQyqM8XWeGFnvKTVSHy9etU0TA",
authDomain:"massfrendz.firebaseapp.com",
databaseURL:"https://massfrendz-default-rtdb.firebaseio.com/",
projectId:"massfrendz"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();
let me=null;

auth.onAuthStateChanged(u=>{
if(u){
me=u;
loginScreen.style.display="none";
app.style.display="block";
myName.innerText=u.displayName;

db.ref("users/"+u.uid).update({
name:u.displayName,
pic:u.photoURL,
online:true
});

loadPosts();
loadFriends();
}else{
loginScreen.style.display="flex";
app.style.display="none";
}
});

function login(){
auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

function logout(){
db.ref("users/"+me.uid).update({online:false});
auth.signOut();
}

function addPost(){
let t=postTxt.value.trim();
if(!t)return;
db.ref("posts").push({uid:me.uid,text:t});
postTxt.value="";
}

function loadPosts(){
db.ref("posts").limitToLast(10).on("child_added",s=>{
db.ref("users/"+s.val().uid).once("value",u=>{
posts.innerHTML=
`<div class="card">
<b>${u.val().name}</b>
<p>${s.val().text}</p>
<button onclick="openChat('${s.val().uid}','${u.val().name}')">Message</button>
</div>`+posts.innerHTML;
});
});
}

function loadFriends(){
db.ref("friends/"+me.uid).on("value",snap=>{
friends.innerHTML="";
snap.forEach(s=>{
db.ref("users/"+s.key).once("value",u=>{
friends.innerHTML+=
`<div class="friend">
<img src="${u.val().pic}">
${u.val().name}
<button onclick="openChat('${s.key}','${u.val().name}')">Chat</button>
</div>`;
});
});
});
}

function openChat(uid,name){
if(document.getElementById("chat_"+uid))return;

chatBox.innerHTML=
`<div class="chat" id="chat_${uid}">
<div style="padding:8px;background:#0084ff;color:white">${name}
<span style="float:right;cursor:pointer" onclick="this.parentElement.parentElement.remove()">✖</span>
</div>
<div class="chat-body" id="body_${uid}"></div>
<div style="padding:5px">
<input id="inp_${uid}" style="width:80%">
<button onclick="sendMsg('${uid}')">Send</button>
</div>
</div>`;

db.ref("msgs/"+me.uid+"_"+uid).on("child_added",s=>{
document.getElementById("body_"+uid).innerHTML+=
`<div class="${s.val().s==me.uid?'msg-me':'msg-them'}">${s.val().t}</div>`;
});
}

function sendMsg(uid){
let v=document.getElementById("inp_"+uid).value;
if(!v)return;
db.ref("msgs/"+me.uid+"_"+uid).push({s:me.uid,t:v});
document.getElementById("inp_"+uid).value="";
}
</script>
</body>
</html>
